<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F1EA">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23F5F1EA'/%3E%3Crect x='5' y='5' width='54' height='54' fill='none' stroke='%23A88A57' stroke-width='2'/%3E%3Ctext x='32' y='43' font-family='Songti SC,serif' font-size='30' fill='%231A1714' text-anchor='middle'%3E%E7%BB%87%3C/text%3E%3C/svg%3E">
<title>身外织物 · 工资单</title>
<style>
  :root{
    --bg:#F5F1EA; --paper:#FBF9F5; --ink:#1A1714; --ink2:#5C544B; --ink3:#9A9187;
    --hair:#DDD4C7; --hair2:#EAE3D8; --gold:#A88A57; --goldd:#8C7043; --wash:#F0E8DA;
    --red:#9E4A3C; --safe-b:env(safe-area-inset-bottom,0px);
    --song:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",serif;
    --didot:Didot,"Bodoni 72","Bodoni MT","Playfair Display",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{margin:0 auto;max-width:520px;background:var(--bg);color:var(--ink);
       font:300 15px/1.65 var(--sans);-webkit-font-smoothing:antialiased;letter-spacing:.02em;
       padding:0 24px calc(48px + var(--safe-b))}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  input{font:inherit;color:inherit}
  .num{font-family:var(--didot);font-weight:400;letter-spacing:0;font-variant-numeric:lining-nums}

  /* ---------- 刊头 ---------- */
  .mast{text-align:center;padding:52px 0 30px}
  .mast .en{font-family:var(--didot);font-size:11px;letter-spacing:.42em;color:var(--gold);text-transform:uppercase;padding-left:.42em}
  .mast h1{font-family:var(--song);font-weight:600;font-size:34px;letter-spacing:.5em;padding-left:.5em;margin:14px 0 0;line-height:1.2}
  .mast .rule{display:flex;align-items:center;gap:14px;margin:24px auto 0;width:180px;color:var(--gold)}
  .mast .rule:before,.mast .rule:after{content:"";flex:1;height:1px;background:var(--gold);opacity:.55}
  .mast .rule i{width:5px;height:5px;transform:rotate(45deg);border:1px solid var(--gold)}
  .mast .sub{font-size:12.5px;color:var(--ink2);letter-spacing:.32em;padding-left:.32em;margin-top:18px}

  /* ---------- 月份 ---------- */
  .month{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--ink);border-bottom:1px solid var(--hair);padding:16px 0}
  .month .arrow{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
  .month .arrow svg{width:16px;height:16px}
  .month .arrow:active{opacity:.4}
  .month .cur{text-align:center}
  .month .cur b{display:block;font-size:30px;line-height:1;font-family:var(--didot);font-weight:400}
  .month .cur span{font-size:11.5px;color:var(--ink3);letter-spacing:.3em;padding-left:.3em}

  /* ---------- 员工 ---------- */
  .emp{padding:30px 0 30px;border-bottom:1px solid var(--hair)}
  .ehead{display:flex;align-items:baseline;justify-content:space-between}
  .ehead .no{font-family:var(--didot);font-style:italic;font-size:15px;color:var(--gold);letter-spacing:.06em}
  .ehead .del{font-size:12px;color:var(--ink3);letter-spacing:.2em}
  .nm{display:block;width:100%;border:0;border-bottom:1px solid var(--hair);background:transparent;outline:none;
      font-family:var(--song);font-size:24px;font-weight:600;letter-spacing:.18em;padding:8px 0 10px;margin-top:6px;border-radius:0}
  .nm::placeholder{color:#C9C0B4;font-weight:400}
  .nm:focus,.perfbox:focus-within{border-color:var(--ink)}
  .lbl{display:block;font-size:11.5px;color:var(--ink3);letter-spacing:.28em;margin:22px 0 4px}
  .perfbox{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--hair)}
  .perfbox span{font-family:var(--didot);font-size:20px;color:var(--ink3)}
  .perf{flex:1;min-width:0;border:0;background:transparent;outline:none;font-family:var(--didot);font-size:26px;padding:6px 0 8px;border-radius:0;-moz-appearance:textfield}
  .perf::-webkit-outer-spin-button,.perf::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .perf::placeholder{color:#C9C0B4}

  .rest{display:flex;border:1px solid var(--hair);margin-top:8px}
  .rest button{flex:1;padding:11px 0;font-size:14px;color:var(--ink2);letter-spacing:.24em;border-left:1px solid var(--hair);transition:background .2s,color .2s}
  .rest button:first-child{border-left:0}
  .rest button.on{background:var(--ink);color:var(--paper);font-weight:400}

  /* 当月日历：点日期就选中 */
  .cal{margin-top:14px;background:var(--paper);border:1px solid var(--hair2);padding:14px 12px 12px}
  .cal .hd{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);letter-spacing:.2em;padding:0 4px 10px}
  .cal .hd b{color:var(--ink);font-weight:400}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
  .grid .wd{font-size:11px;color:var(--ink3);padding-bottom:4px}
  .grid button{aspect-ratio:1;font-family:var(--didot);font-size:16px;color:var(--ink);display:flex;align-items:center;justify-content:center;border:1px solid transparent}
  .grid button:active{background:var(--wash)}
  .grid button.on{background:var(--gold);color:#fff}
  .grid .we{color:var(--ink3)}
  .cal .ft{font-size:12.5px;color:var(--ink2);padding:10px 4px 0;border-top:1px solid var(--hair2);margin-top:10px;min-height:1.6em}

  /* 结果 */
  .result{margin-top:26px}
  .result .row{display:flex;align-items:baseline;justify-content:space-between}
  .result .k{font-size:11.5px;color:var(--ink3);letter-spacing:.28em}
  .result .net{font-family:var(--didot);font-size:44px;line-height:1;color:var(--ink)}
  .result .net small{font-size:.5em;color:var(--ink3);margin-right:4px;vertical-align:.35em}
  .result .bd{font-size:12.5px;color:var(--ink2);margin-top:10px;text-align:right;letter-spacing:.04em}
  .result .bd .num{font-size:14px}
  .result .wait{font-size:13px;color:var(--ink3);text-align:right;font-style:italic;font-family:var(--song)}
  .scale{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:20px}
  .scale div{text-align:center;font-size:10.5px;color:var(--ink3);letter-spacing:.02em}
  .scale div:before{content:"";display:block;height:2px;background:var(--hair);margin-bottom:7px}
  .scale div b{display:block;font-family:var(--didot);font-weight:400;font-size:14px;color:var(--ink3)}
  .scale div.on:before{background:var(--gold);height:3px;margin-top:-1px}
  .scale div.on,.scale div.on b{color:var(--goldd)}

  .act{display:flex;justify-content:flex-end;margin-top:22px}
  .link{font-size:13px;letter-spacing:.24em;color:var(--ink);padding:6px 0;border-bottom:1px solid var(--ink);display:inline-flex;align-items:center;gap:10px}
  .link:after{content:"";width:18px;height:1px;background:currentColor;position:relative;top:0}
  .link:active{opacity:.5}
  .err{color:var(--red);font-size:12.5px;text-align:right;margin-top:8px;min-height:0}
  .err:empty{display:none}
  .out{display:none;margin-top:20px}
  .out img{width:100%;display:block;box-shadow:0 18px 40px -18px rgba(60,44,24,.35)}
  .out p{text-align:center;font-size:11.5px;color:var(--ink3);letter-spacing:.24em;margin:12px 0 0}

  .add{display:block;width:100%;padding:22px 0;border-bottom:1px solid var(--hair);font-size:13px;letter-spacing:.32em;color:var(--ink2);text-align:center}
  .add span{font-family:var(--didot);font-size:18px;color:var(--gold);margin-right:10px;vertical-align:-1px}
  .add:active{background:var(--wash)}

  /* ---------- 合计：和工资单图片同一个双线金框 ---------- */
  .total{margin-top:44px;background:var(--paper);border:1px solid var(--gold);outline:1px solid var(--hair);outline-offset:-7px;padding:34px 28px 30px}
  .total .cap{text-align:center;font-size:10.5px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);font-family:var(--didot);padding-left:.42em}
  .total h2{text-align:center;font-family:var(--song);font-weight:600;font-size:19px;letter-spacing:.4em;padding-left:.4em;margin:8px 0 22px}
  .ledger .li{display:flex;align-items:baseline;gap:10px;padding:11px 0;border-top:1px solid var(--hair2)}
  .ledger .li:first-child{border-top:1px solid var(--hair)}
  .ledger .who{font-family:var(--song);font-size:16px;letter-spacing:.12em}
  .ledger .who small{display:block;font-family:var(--sans);font-size:11px;color:var(--ink3);letter-spacing:.04em}
  .ledger .dots{flex:1;border-bottom:1px dotted #CFC5B7;transform:translateY(-5px)}
  .ledger .amt{font-family:var(--didot);font-size:19px}
  .grand{border-top:1px solid var(--ink);margin-top:6px;padding-top:4px}
  .grand:before{content:"";display:block;border-top:1px solid var(--ink);margin-bottom:18px}
  .grand .row{display:flex;justify-content:space-between;align-items:baseline}
  .grand .k{font-size:12px;letter-spacing:.3em;color:var(--ink2)}
  .grand .v{font-family:var(--didot);font-size:46px;line-height:1;color:var(--goldd)}
  .grand .meta{font-size:12px;color:var(--ink3);text-align:right;margin-top:10px;letter-spacing:.06em}
  .grand .warn{font-size:12px;color:var(--red);text-align:right;margin-top:4px}
  .total .empty{text-align:center;font-family:var(--song);font-style:italic;color:var(--ink3);font-size:14px;padding:18px 0 4px;border-top:1px solid var(--hair)}
  .total .act{justify-content:center;margin-top:26px}
  .total .err{text-align:center}

  /* ---------- 说明 ---------- */
  .notes{margin-top:44px;border-top:1px solid var(--ink)}
  details{border-bottom:1px solid var(--hair)}
  summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:18px 0;font-family:var(--song);font-size:15.5px;letter-spacing:.24em}
  summary::-webkit-details-marker{display:none}
  summary:after{content:"";width:9px;height:9px;border-right:1px solid var(--ink2);border-bottom:1px solid var(--ink2);transform:rotate(45deg) translate(-2px,-2px);transition:transform .25s}
  details[open] summary:after{transform:rotate(-135deg) translate(-2px,-2px)}
  .in{padding:0 0 18px}
  .kv{display:flex;justify-content:space-between;padding:9px 0;font-size:13.5px;border-top:1px solid var(--hair2)}
  .kv:first-child{border-top:0}
  .kv span{color:var(--ink3);letter-spacing:.16em}
  .kv b{font-weight:400}
  .kv b.num{font-size:16px}
  .in p{font-size:12.5px;color:var(--ink2);line-height:1.8;margin:12px 0 0;padding:12px 14px;background:var(--paper);border-left:2px solid var(--gold)}
  footer{text-align:center;font-size:10.5px;color:var(--ink3);letter-spacing:.3em;margin-top:40px;padding-left:.3em}
  footer .num{display:block;font-size:12px;letter-spacing:.4em;color:var(--gold);margin-bottom:6px}

  @media (max-width:360px){ body{padding-left:18px;padding-right:18px} .mast h1{font-size:29px} .result .net{font-size:38px} .grand .v{font-size:38px} }
</style>
</head>
<body>

<header class="mast">
  <div class="en">Shenwai · Zhiwu</div>
  <h1>身外织物</h1>
  <div class="rule"><i></i></div>
  <div class="sub">员工工资单 · 销售岗</div>
</header>

<div class="month">
  <button class="arrow" id="prevM" aria-label="上个月"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M10 2 4 8l6 6"/></svg></button>
  <div class="cur"><b id="monNum"></b><span id="monCn"></span></div>
  <button class="arrow" id="nextM" aria-label="下个月"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="m6 2 6 6-6 6"/></svg></button>
</div>

<div id="list"></div>
<button class="add" id="addEmp"><span>+</span>添加员工</button>

<section class="total">
  <div class="cap">Monthly Total</div>
  <h2>本月合计</h2>
  <div id="sum"></div>
  <div class="act"><button class="link" id="sumBtn">生成汇总图片</button></div>
  <div class="err" id="sumErr"></div>
  <div class="out" id="sumOut"><img alt="工资汇总"><p>长按图片保存或转发</p></div>
</section>

<div class="notes">
  <details>
    <summary>基本待遇</summary>
    <div class="in" id="basic"></div>
  </details>
  <details>
    <summary>提成规则</summary>
    <div class="in"><div id="tiers"></div>
      <p>提成按「当月总业绩 × 所在档位比例」整体计算。比如当月业绩 10 万，落在 9 万–12 万这一档，提成就是 10 万 × 3% = 3,000 元。</p>
    </div>
  </details>
</div>

<footer><span class="num">S · Z</span>数据只保存在这台手机</footer>

<script>
/* ========= 工资规则：改数字只改这里 ========= */
const RULE = { name:"销售岗", base:7000, social:700 };
/* 当月业绩 < upTo 时用这一档；整体按档位比例计算 */
const TIERS = [
  { upTo:50000,    label:"5 万以下",       short:"5万以下", rate:.01 },
  { upTo:90000,    label:"5 万 – 9 万",    short:"5–9万",   rate:.02 },
  { upTo:120000,   label:"9 万 – 12 万",   short:"9–12万",  rate:.03 },
  { upTo:140000,   label:"12 万 – 14 万",  short:"12–14万", rate:.04 },
  { upTo:Infinity, label:"14 万及以上",    short:"14万+",   rate:.05 },
];
const REST = { normal:"正常休", more:"多休", less:"少休" };
const CN_M = ["一","二","三","四","五","六","七","八","九","十","十一","十二"];

const $ = id => document.getElementById(id);
const money = v => "¥" + (Math.round(v*100)/100).toLocaleString("zh-CN",{maximumFractionDigits:2});
const plain = v => (Math.round(v*100)/100).toLocaleString("zh-CN",{maximumFractionDigits:2});
const pct = r => (r*100).toFixed(0) + "%";
const tierOf = p => TIERS.find(t => p < t.upTo);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const md = s => { const [,m,d]=s.split("-"); return (+m)+"月"+(+d)+"日"; };
/* 业绩输入：编辑时是纯数字，离开输入框显示千分位 */
const cleanPerf = v => { let t = String(v).replace(/[^\d.]/g,""); const i = t.indexOf("."); if(i>=0) t = t.slice(0,i+1) + t.slice(i+1).replace(/\./g,""); return t; };
const fmtPerf = v => { if(v===""||v==null) return ""; const [a,b] = String(v).split("."); return (+a).toLocaleString("en-US") + (b!==undefined ? "."+b : ""); };
const pad2 = n => String(n).padStart(2,"0");

$("basic").innerHTML = [
  ["岗位", RULE.name, ""], ["月底薪", money(RULE.base), "num"], ["出勤", "正常出勤", ""],
  ["社保", "每月扣 " + money(RULE.social), ""], ["提成", "按当月业绩阶梯计算", ""],
].map(([k,v,c]) => `<div class="kv"><span>${k}</span><b class="${c}">${v}</b></div>`).join("");
$("tiers").innerHTML = TIERS.map(t => `<div class="kv"><span>${t.label}</span><b class="num">${pct(t.rate)}</b></div>`).join("");

/* ========= 数据：按月份存在这台手机里 ========= */
const KEY = "shenwai-payroll-v1";
let db = { months:{} };
try { const raw = JSON.parse(localStorage.getItem(KEY)); if(raw && raw.months) db = raw; } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e) {} }

let month = "";
const newEmp = name => ({ id: Date.now().toString(36)+Math.random().toString(36).slice(2,6),
                          name: name||"", perf:"", rest:"normal", dates:[] });
/* 新的月份：沿用最近一个月的员工名单，业绩清空 */
function list(){
  if(!db.months[month]){
    const prev = Object.keys(db.months).filter(m => db.months[m].some(e=>e.name)).sort().pop();
    const names = prev ? db.months[prev].map(e=>e.name).filter(Boolean) : [];
    db.months[month] = (names.length ? names : [""]).map(newEmp);
  }
  return db.months[month];
}
const find = id => list().find(e => e.id===id);

function calcPay(e){
  if(e.perf==="" || e.perf==null) return null;
  const p = Math.max(0, +e.perf||0), t = tierOf(p), com = p*t.rate;
  return { p, t, com, net: RULE.base + com - RULE.social };
}
function restText(e){
  if(e.rest==="normal") return ["正常出勤", ""];
  return [`${REST[e.rest]} ${e.dates.length} 天`, e.dates.map(md).join("、")];
}

/* ========= 月份 ========= */
function setMonth(m){
  month = m;
  const [y,mo] = m.split("-");
  $("monNum").textContent = `${y} · ${mo}`;
  $("monCn").textContent = `${CN_M[+mo-1]}月工资`;
  renderList();
}
function shift(n){
  const [y,mo] = month.split("-").map(Number), d = new Date(y, mo-1+n, 1);
  setMonth(`${d.getFullYear()}-${pad2(d.getMonth()+1)}`);
}
$("prevM").onclick = () => shift(-1);
$("nextM").onclick = () => shift(1);

/* ========= 员工 ========= */
function calHTML(e){
  const [y,mo] = month.split("-").map(Number), days = new Date(y,mo,0).getDate();
  const lead = (new Date(y,mo-1,1).getDay()+6)%7;           // 周一开头
  let h = "一二三四五六日".split("").map(w=>`<span class="wd">${w}</span>`).join("");
  h += "<span></span>".repeat(lead);
  for(let d=1; d<=days; d++){
    const iso = `${month}-${pad2(d)}`, wk = (lead+d-1)%7>=5;
    h += `<button data-day="${iso}" class="${e.dates.includes(iso)?"on":""}${wk?" we":""}">${d}</button>`;
  }
  return h;
}
function renderList(){
  $("list").innerHTML = list().map((e,i) => `
    <article class="emp" data-id="${e.id}">
      <div class="ehead"><span class="no">No. ${pad2(i+1)}</span><button class="del">移除</button></div>
      <input class="nm" type="text" placeholder="员工姓名" value="${esc(e.name)}" autocomplete="off">
      <label class="lbl">当月业绩</label>
      <div class="perfbox"><span>¥</span><input class="perf" type="text" inputmode="decimal" placeholder="0" value="${esc(fmtPerf(e.perf))}" autocomplete="off"></div>
      <label class="lbl">本月休息</label>
      <div class="rest">${Object.keys(REST).map(k=>`<button data-rest="${k}" class="${e.rest===k?"on":""}">${REST[k]}</button>`).join("")}</div>
      <div class="cal" style="display:${e.rest==="normal"?"none":""}">
        <div class="hd"><span>点选${REST[e.rest]||""}的日期</span><b>${+month.split("-")[1]} 月</b></div>
        <div class="grid">${calHTML(e)}</div>
        <div class="ft"></div>
      </div>
      <div class="result"></div>
      <div class="act"><button class="link gen">生成工资单</button></div>
      <div class="err"></div>
      <div class="out"><img alt="工资单"><p>长按图片保存或转发给员工</p></div>
    </article>`).join("");
  list().forEach(e => refreshCard(e));
  renderSum();
}
const cardOf = e => $("list").querySelector(`[data-id="${e.id}"]`);
function refreshCard(e){
  const c = cardOf(e); if(!c) return;
  const r = calcPay(e);
  c.querySelector(".cal .hd span").textContent = `点选${REST[e.rest]}的日期`;
  c.querySelector(".cal .ft").textContent = e.dates.length
    ? `${REST[e.rest]} ${e.dates.length} 天 · ${e.dates.map(md).join("、")}` : "还没有选日期";
  c.querySelector(".result").innerHTML = r ? `
    <div class="row"><span class="k">实发工资</span><span class="net"><small>¥</small>${plain(r.net)}</span></div>
    <div class="bd">底薪 <span class="num">${plain(RULE.base)}</span> ＋ 提成 <span class="num">${plain(r.com)}</span> － 社保 <span class="num">${plain(RULE.social)}</span></div>
    <div class="scale">${TIERS.map(t=>`<div class="${t===r.t?"on":""}"><b>${pct(t.rate)}</b>${t.short}</div>`).join("")}</div>`
    : `<div class="row"><span class="k">实发工资</span><span class="wait">填上业绩即可算出</span></div>`;
  c.querySelector(".out").style.display = "none";
  c.querySelector(".err").textContent = "";
}

/* ========= 本月合计 ========= */
function renderSum(){
  const all = list(), done = all.map(e=>[e,calcPay(e)]).filter(([,r])=>r);
  const total = done.reduce((n,[,r])=>n+r.net,0), perf = done.reduce((n,[,r])=>n+r.p,0);
  const miss = all.length - done.length;
  $("sum").innerHTML = done.length ? `
    <div class="ledger">${done.map(([e,r])=>`
      <div class="li"><span class="who">${esc(e.name.trim())||"未填姓名"}<small>业绩 ${money(r.p)} · ${pct(r.t.rate)}</small></span><span class="dots"></span><span class="amt">${money(r.net)}</span></div>`).join("")}
    </div>
    <div class="grand">
      <div class="row"><span class="k">实发合计</span><span class="v">${money(total)}</span></div>
      <div class="meta">共 ${done.length} 人 · 总业绩 ${money(perf)}</div>
      ${miss ? `<div class="warn">另有 ${miss} 人未填业绩，暂未计入</div>` : ""}
    </div>`
    : `<div class="empty">员工填上业绩后，这里自动加总</div>`;
  $("sumOut").style.display = "none"; $("sumErr").textContent = "";
}

/* ========= 交互 ========= */
$("list").addEventListener("input", ev => {
  const c = ev.target.closest(".emp"); if(!c) return; const e = find(c.dataset.id);
  if(ev.target.classList.contains("nm"))   e.name = ev.target.value;
  if(ev.target.classList.contains("perf")){ const v = cleanPerf(ev.target.value); if(v!==ev.target.value) ev.target.value = v; e.perf = v; }
  save(); refreshCard(e); renderSum();
});
$("list").addEventListener("click", ev => {
  const c = ev.target.closest(".emp"); if(!c) return; const e = find(c.dataset.id);
  const b = ev.target.closest("button"); if(!b) return;
  if(b.dataset.rest){
    if(e.rest !== b.dataset.rest) e.dates = [];
    e.rest = b.dataset.rest;
    c.querySelectorAll(".rest button").forEach(x => x.classList.toggle("on", x===b));
    c.querySelectorAll(".grid button.on").forEach(x => x.classList.remove("on"));
    c.querySelector(".cal").style.display = e.rest==="normal" ? "none" : "";
    save(); refreshCard(e); renderSum();
  } else if(b.dataset.day){
    const d = b.dataset.day, has = e.dates.includes(d);
    e.dates = has ? e.dates.filter(x=>x!==d) : [...e.dates, d].sort();
    b.classList.toggle("on", !has); save(); refreshCard(e);
  } else if(b.classList.contains("del")){
    if(!confirm(`移除 ${e.name.trim()||"这位员工"}？`)) return;
    db.months[month] = list().filter(x => x!==e); save(); renderList();
  } else if(b.classList.contains("gen")){
    make(e, c);
  }
});
$("list").addEventListener("focusin", ev => { if(ev.target.classList.contains("perf")){ const e = find(ev.target.closest(".emp").dataset.id); ev.target.value = e.perf; } });
$("list").addEventListener("focusout", ev => { if(ev.target.classList.contains("perf")){ const e = find(ev.target.closest(".emp").dataset.id); ev.target.value = fmtPerf(e.perf); } });
$("addEmp").onclick = () => {
  list().push(newEmp("")); save(); renderList();
  const cards = $("list").querySelectorAll(".emp"), last = cards[cards.length-1];
  last.scrollIntoView({behavior:"smooth", block:"center"}); last.querySelector(".nm").focus({preventScroll:true});
};
$("sumBtn").onclick = makeSum;

/* ========= 画图公用 ========= */
const INK="#141210", INK2="#5F564D", INK3="#9C938A", AC="#A9873F", BD="#D8CDBB";
const F=(w,s)=>`${w} ${s}px -apple-system,"PingFang SC","Hiragino Sans GB",sans-serif`;
const SONG=(w,s)=>`${w} ${s}px "Songti SC","STSong",serif`;
const SERIF=s=>`400 ${s}px Didot,"Bodoni 72",Georgia,serif`;
function sheet(W,H,title){
  const c=document.createElement("canvas"); c.width=W; c.height=H;
  const x=c.getContext("2d"), [ym,mm]=month.split("-");
  x.fillStyle="#FAF8F5"; x.fillRect(0,0,W,H);
  x.strokeStyle="#C9B183"; x.lineWidth=2.5; x.strokeRect(36,36,W-72,H-72);
  x.strokeStyle=BD; x.lineWidth=1; x.strokeRect(46,46,W-92,H-92);
  x.textAlign="center"; x.fillStyle=AC; x.font=SONG(600,40); x.fillText("身 外 织 物",W/2,160);
  x.fillStyle=INK; x.font=SONG(600,60); x.fillText(title,W/2,250);
  x.fillStyle=INK3; x.font=F(400,28); x.fillText(`${ym} 年 ${+mm} 月`,W/2,298);
  x.strokeStyle=BD; x.beginPath(); x.moveTo(96,330); x.lineTo(W-96,330); x.stroke();
  x.textAlign="left";
  return [c,x];
}
const hline = (x,y,a,b) => { x.strokeStyle=BD; x.beginPath(); x.moveTo(a,y); x.lineTo(b,y); x.stroke(); };
function show(out, c){ const img=out.querySelector("img"); img.src=c.toDataURL("image/png"); out.style.display="block"; out.scrollIntoView({behavior:"smooth", block:"start"}); }

/* ========= 单人工资单图片 ========= */
function make(e, card){
  const err = card.querySelector(".err"), r = calcPay(e), name = e.name.trim();
  err.textContent = "";
  if(!name) return err.textContent = "请先填写员工姓名";
  if(!r) return err.textContent = "请填写当月业绩";
  if(e.rest!=="normal" && !e.dates.length) return err.textContent = `选了「${REST[e.rest]}」，请添加具体日期`;

  const [rt, rd] = restText(e);
  const lines = [
    ["姓名", name, ""], ["岗位", RULE.name, ""], ["当月业绩", money(r.p), ""],
    ["月底薪", money(RULE.base), ""], ["提成", `＋${money(r.com)}（${pct(r.t.rate)}）`, ""],
    ["社保", "－" + money(RULE.social), ""], ["出勤", rt, rd],
  ];
  const W=1080, PAD=96, linesH = lines.reduce((n,l)=>n+(l[2]?118:76),0);
  const [c,x] = sheet(W, 400 + linesH + 40 + TIERS.length*64 + 40 + 190 + 260, "工 资 单");

  let y=400;
  for(const [k,v,sub] of lines){
    x.fillStyle=INK3; x.font=F(400,32); x.fillText(k,PAD,y);
    x.fillStyle=INK;  x.font=F(600,34); x.textAlign="right"; x.fillText(v,W-PAD,y);
    if(sub){ x.fillStyle=INK2; x.font=F(400,28); x.fillText(sub,W-PAD,y+44); }
    x.textAlign="left"; y += sub?118:76;
  }
  y+=10; x.fillStyle=INK3; x.font=F(400,30); x.fillText("提成档位（当月个人业绩）",PAD,y); y+=30;
  for(const tr of TIERS){
    y+=64; const hit = tr===r.t;
    x.fillStyle= hit ? "#F3E6CB" : "#F2EEE7"; x.fillRect(PAD,y-44,W-PAD*2,58);
    x.fillStyle= hit ? INK : INK2; x.font=F(hit?600:400,32); x.fillText(tr.label + (hit?"　← 本月":""),PAD+24,y);
    x.fillStyle=AC; x.font=F(700,34); x.textAlign="right"; x.fillText(pct(tr.rate),W-PAD-24,y); x.textAlign="left";
  }
  y+=60; hline(x,y,PAD,W-PAD);
  y+=90; x.fillStyle=INK2; x.font=F(400,34); x.fillText("实发工资",PAD,y);
  x.fillStyle=AC; x.font=SERIF(72); x.textAlign="right"; x.fillText(money(r.net),W-PAD,y+8); x.textAlign="left";
  y+=60; hline(x,y,PAD,W-PAD);

  /* 签名先留空，纸上或以后再签 */
  y+=100; x.fillStyle=INK3; x.font=F(400,30); x.strokeStyle=INK3;
  x.fillText("员工签名",PAD,y); x.beginPath(); x.moveTo(PAD+140,y+6); x.lineTo(PAD+470,y+6); x.stroke();
  x.fillText("日期",PAD+530,y);   x.beginPath(); x.moveTo(PAD+610,y+6); x.lineTo(W-PAD,y+6); x.stroke();

  show(card.querySelector(".out"), c);
}

/* ========= 全店汇总图片 ========= */
function makeSum(){
  const done = list().map(e=>[e,calcPay(e)]).filter(([,r])=>r);
  $("sumErr").textContent = "";
  if(!done.length) return $("sumErr").textContent = "还没有员工填业绩";
  const total = done.reduce((n,[,r])=>n+r.net,0), perf = done.reduce((n,[,r])=>n+r.p,0);
  const miss = list().length - done.length;
  const W=1080, PAD=96;
  const [c,x] = sheet(W, 400 + 70 + done.length*96 + 60 + 200 + (miss?60:0) + 120, "工 资 汇 总");

  const cx = [PAD, 470, 700, W-PAD];   // 姓名 / 业绩 / 提成 / 实发
  let y=400;
  x.fillStyle=INK3; x.font=F(400,28);
  x.fillText("姓名",cx[0],y);
  x.textAlign="right"; x.fillText("当月业绩",cx[1]+120,y); x.fillText("提成",cx[2]+90,y); x.fillText("实发工资",cx[3],y); x.textAlign="left";
  y+=30; hline(x,y,PAD,W-PAD);
  for(const [e,r] of done){
    y+=66;
    x.fillStyle=INK; x.font=F(600,34); x.fillText(e.name.trim()||"未填姓名",cx[0],y);
    x.textAlign="right";
    x.fillStyle=INK2; x.font=F(400,30); x.fillText(money(r.p),cx[1]+120,y); x.fillText(pct(r.t.rate),cx[2]+90,y);
    x.fillStyle=INK; x.font=F(600,34); x.fillText(money(r.net),cx[3],y);
    x.textAlign="left"; y+=30; hline(x,y,PAD,W-PAD);
  }
  y+=60; x.fillStyle=INK2; x.font=F(400,30); x.fillText(`共 ${done.length} 人 · 总业绩 ${money(perf)}`,PAD,y);
  y+=110; x.fillStyle=INK2; x.font=F(400,34); x.fillText("实发工资合计",PAD,y);
  x.fillStyle=AC; x.font=SERIF(76); x.textAlign="right"; x.fillText(money(total),W-PAD,y+8); x.textAlign="left";
  if(miss){ y+=70; x.fillStyle="#B0644F"; x.font=F(400,28); x.fillText(`另有 ${miss} 人未填业绩，未计入合计`,PAD,y); }

  show($("sumOut"), c);
}

/* 初始化 */
(function(){
  const d = new Date();
  setMonth(`${d.getFullYear()}-${pad2(d.getMonth()+1)}`);
})();

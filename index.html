<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#23201C">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2323201C'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' fill='%23D4B26A' text-anchor='middle'%3E%C2%A5%3C/text%3E%3C/svg%3E">
<title>身外织物 · 工资单</title>
<style>
  :root{
    --paper:#F7F4EF; --card:#FFFFFF; --dark:#23201C;
    --gold:#B8893C; --goldl:#D4B26A;
    --ink:#14110E; --ink2:#5A5148; --ink3:#948B81;
    --line:#E7E0D6; --tint:#FBF3E4; --red:#C0453A;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--paper)}
  body{
    margin:0 auto;max-width:560px;background:var(--paper);color:var(--ink);
    font:400 15px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:18px 16px calc(32px + var(--safe-b));
  }
  .serif{font-family:"Bodoni 72",Didot,Georgia,"Times New Roman",serif;font-weight:400}

  .hero{background:var(--dark);border-radius:20px;padding:24px 24px 20px;color:#B6ACA0;
        box-shadow:0 5px 20px rgba(60,48,36,.10)}
  .hero .brand{font-family:"Songti SC","STSong",serif;font-size:30px;color:var(--goldl);letter-spacing:.18em;margin:0}
  .hero .t{font-size:14px;margin-top:6px;letter-spacing:.06em}
  h2{font-size:13px;color:var(--ink3);font-weight:500;letter-spacing:.08em;margin:22px 4px 8px}
  .card{background:var(--card);border-radius:16px;padding:6px 18px;box-shadow:0 1px 3px rgba(60,48,36,.05)}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
  .row:first-child{border-top:0}
  .row .k{color:var(--ink2)}
  .row .v{font-weight:600;text-align:right}
  .row .v small{display:block;font-weight:400;font-size:12.5px;color:var(--ink3)}
  .minus{color:var(--red)}

  table{width:100%;border-collapse:collapse;font-size:14.5px}
  th,td{padding:11px 4px;text-align:left;border-top:1px solid var(--line)}
  th{font-size:12.5px;color:var(--ink3);font-weight:500;border-top:0}
  td:last-child,th:last-child{text-align:right}
  td.rate{font-weight:600;color:var(--gold);font-size:16px}
  .tip{font-size:13px;color:var(--ink2);background:var(--tint);border-radius:12px;padding:11px 14px;margin:10px 0 4px}

  label.f{display:block;font-size:13px;color:var(--ink3);margin:12px 0 6px}
  input[type=text],input[type=number],input[type=date],input[type=month]{
    width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;
    background:#FDFCFA;color:var(--ink);outline:none;-webkit-appearance:none;appearance:none}
  input:focus{border-color:var(--goldl)}
  .sign{padding:16px 18px 18px}
  .btn{display:block;width:100%;border:0;border-radius:14px;background:var(--dark);color:var(--goldl);
       font:inherit;font-size:16px;font-weight:600;padding:15px;margin-top:14px;cursor:pointer;letter-spacing:.06em}
  .btn:active{opacity:.75}
  .err{color:var(--red);font-size:13px;margin-top:8px;min-height:1em}

  #out{display:none;margin-top:18px}
  #out img{width:100%;border-radius:12px;box-shadow:0 4px 18px rgba(60,48,36,.14);display:block}
  #out p{text-align:center;font-size:13.5px;color:var(--ink2);margin:10px 0 0}
  footer{text-align:center;font-size:12px;color:var(--ink3);margin-top:28px}

  .opts{display:flex;gap:8px}
  .opts button{flex:1;text-align:center;border:1px solid var(--line);border-radius:12px;padding:10px 0;
              font-size:15px;color:var(--ink2);background:#FDFCFA;cursor:pointer}
    .opts button.on{border-color:var(--gold);background:var(--tint);color:var(--ink);font-weight:600}
  .addrow{display:flex;gap:8px;margin-top:10px}
  .addrow input{flex:1}
  .addrow button{flex:none;border:0;border-radius:12px;background:var(--dark);color:var(--goldl);
                 font:inherit;font-size:15px;padding:0 18px;cursor:pointer}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--tint);border-radius:999px;
        padding:5px 8px 5px 12px;font-size:14px;color:var(--ink)}
  .chip button{border:0;background:#E9DCC4;color:var(--ink2);width:20px;height:20px;border-radius:50%;
               font-size:13px;line-height:20px;padding:0;cursor:pointer}
  .count{font-size:13px;color:var(--ink3);margin-top:8px}

  .pay{background:var(--dark);border-radius:20px;padding:20px 22px;color:#B6ACA0;margin-top:14px}
  .pay .lab{font-size:13px}
  .pay .big{font-size:46px;color:var(--goldl);line-height:1.1;margin:4px 0 12px;word-break:break-all}
  .pay .ln{display:flex;justify-content:space-between;font-size:14px;padding:7px 0;border-top:1px solid #38322C}
  .pay .ln b{color:#EDE6DB;font-weight:500}
  .pay .ln b.m{color:#E39B91}
  .pay .ln b.g{color:var(--goldl);font-weight:600}
  .pay .empty{font-size:14px;padding:4px 0 2px}
  .pay table{margin-top:10px;font-size:13.5px}
  .pay td{border-top:1px solid #38322C;padding:8px 6px;color:#B6ACA0}
  .pay td.rate{color:var(--goldl);font-size:14px}
  .pay tr.hit td{background:#3A3127;color:#F1E3C4;font-weight:600}
  .pay tr.hit td:first-child{border-radius:6px 0 0 6px}
  .pay tr.hit td:last-child{border-radius:0 6px 6px 0}
  .pay .tl{font-size:12.5px;color:#8E857A;margin-top:14px}
  details{background:var(--card);border-radius:16px;margin-top:12px;box-shadow:0 1px 3px rgba(60,48,36,.05)}
  summary{list-style:none;cursor:pointer;padding:15px 18px;font-size:15px;color:var(--ink2);display:flex;justify-content:space-between}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"展开";font-size:13px;color:var(--ink3)}
  details[open] summary::after{content:"收起"}
  details .in{padding:0 18px 14px}
  details .in .row:first-child{border-top:1px solid var(--line)}
  details .tip{margin:12px 0 0}

  .opts button{font:inherit;font-size:15px}
  .monbar{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 18px}
  .monbar span{flex:none;color:var(--ink2);font-size:14px}
  .emp{padding:14px 18px 16px;margin-top:12px}
  .ehead{display:flex;gap:10px;align-items:center}
  .ehead .no{flex:none;width:26px;height:26px;border-radius:50%;background:var(--dark);color:var(--goldl);
             font-size:13px;display:flex;align-items:center;justify-content:center}
  .ehead input{flex:1}
  .del{flex:none;border:0;background:none;color:var(--ink3);font:inherit;font-size:13px;padding:6px 2px;cursor:pointer}
  .epay{background:var(--tint);border-radius:12px;padding:12px 14px;margin-top:14px}
  .epay .lab{font-size:12.5px;color:var(--ink3)}
  .epay .big{font-size:32px;color:var(--gold);line-height:1.15;margin:2px 0 4px}
  .epay .line{font-size:13px;color:var(--ink2)}
  .epay .badge{display:inline-block;margin-top:8px;font-size:12.5px;background:#F1E3C4;color:#7A5A22;border-radius:999px;padding:3px 10px}
  .epay .empty{font-size:13.5px;color:var(--ink3)}
  .btn.sm{font-size:15px;padding:12px;margin-top:12px}
  .out{display:none;margin-top:14px}
  .out img{width:100%;border-radius:12px;box-shadow:0 4px 18px rgba(60,48,36,.14);display:block}
  .out p{text-align:center;font-size:13px;color:var(--ink2);margin:8px 0 0}
  .addemp{display:block;width:100%;margin-top:12px;border:1.5px dashed #CDBFA9;border-radius:16px;background:transparent;
          color:var(--gold);font:inherit;font-size:15px;font-weight:600;padding:14px;cursor:pointer}
  .pay .stab td{font-size:14px}
  .pay .stab td small{display:block;font-size:11.5px;color:#8E857A;font-weight:400}
  .pay .stab tr.tot td{border-top:1px solid #6B5E4D;color:var(--goldl);font-weight:600}
  .pay .warn{font-size:12.5px;color:#E3B98F;margin-top:10px}
</style>
</head>
<body>

<section class="hero" style="padding-bottom:18px">
  <p class="brand">身外织物</p>
  <div class="t">员工工资单 · 销售岗</div>
</section>

<div class="card monbar">
  <span>工资月份</span>
  <input id="mon" type="month">
</div>

<div id="list"></div>
<button class="addemp" id="addEmp">＋ 添加员工</button>

<h2>本月合计</h2>
<div class="pay" id="sum" style="margin-top:0"></div>
<button class="btn" id="sumBtn">生成全店汇总图片</button>
<div class="err" id="sumErr"></div>
<div class="out" id="sumOut"><img alt="工资汇总"><p>长按图片保存或转发</p></div>

<details>
  <summary>基本待遇</summary>
  <div class="in" id="basic"></div>
</details>
<details>
  <summary>提成规则</summary>
  <div class="in">
    <table>
      <thead><tr><th>当月个人业绩</th><th>提成比例</th></tr></thead>
      <tbody id="tiers"></tbody>
    </table>
    <div class="tip">提成按「当月总业绩 × 所在档位比例」整体计算。比如当月业绩 10 万，落在 9 万–12 万这一档，提成就是 10 万 × 3% = 3,000 元。</div>
  </div>
</details>

<footer>身外织物 · 数据只存在这台手机里，不上传</footer>

<script>
/* ========= 工资规则：改数字只改这里 ========= */
const RULE = { name:"销售岗", base:7000, social:700 };
/* 当月业绩 < upTo 时用这一档；整体按档位比例计算 */
const TIERS = [
  { upTo:50000,    label:"5 万以下",       rate:.01 },
  { upTo:90000,    label:"5 万 – 9 万",    rate:.02 },
  { upTo:120000,   label:"9 万 – 12 万",   rate:.03 },
  { upTo:140000,   label:"12 万 – 14 万",  rate:.04 },
  { upTo:Infinity, label:"14 万及以上",    rate:.05 },
];
const REST = { normal:"正常休", more:"多休", less:"少休" };

const $ = id => document.getElementById(id);
const money = v => "¥" + (Math.round(v*100)/100).toLocaleString("zh-CN",{maximumFractionDigits:2});
const pct = r => (r*100).toFixed(0) + "%";
const tierOf = p => TIERS.find(t => p < t.upTo);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const md = s => { const [,m,d]=s.split("-"); return (+m)+"月"+(+d)+"日"; };

$("basic").innerHTML = `
  <div class="row"><span class="k">岗位</span><span class="v">${RULE.name}</span></div>
  <div class="row"><span class="k">月底薪</span><span class="v">${money(RULE.base)}</span></div>
  <div class="row"><span class="k">出勤</span><span class="v">正常出勤</span></div>
  <div class="row"><span class="k">社保</span><span class="v minus">每月扣 ${money(RULE.social)}</span></div>
  <div class="row"><span class="k">提成</span><span class="v">按当月业绩阶梯计算</span></div>`;
$("tiers").innerHTML = TIERS.map(t => `<tr><td>${t.label}</td><td class="rate">${pct(t.rate)}</td></tr>`).join("");

/* ========= 数据：按月份存在这台手机里 ========= */
const KEY = "shenwai-payroll-v1";
let db = { months:{} };
try { const raw = JSON.parse(localStorage.getItem(KEY)); if(raw && raw.months) db = raw; } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e) {} }

let month = "";
const newEmp = name => ({ id: Date.now().toString(36)+Math.random().toString(36).slice(2,6),
                          name: name||"", perf:"", rest:"normal", dates:[] });
/* 新的月份：沿用最近一个月的员工名单，业绩清空 */
function list(){
  if(!db.months[month]){
    const prev = Object.keys(db.months).filter(m => db.months[m].some(e=>e.name)).sort().pop();
    const names = prev ? db.months[prev].map(e=>e.name).filter(Boolean) : [];
    db.months[month] = (names.length ? names : [""]).map(newEmp);
  }
  return db.months[month];
}
const find = id => list().find(e => e.id===id);

function calcPay(e){
  if(e.perf==="" || e.perf==null) return null;
  const p = Math.max(0, +e.perf||0), t = tierOf(p), com = p*t.rate;
  return { p, t, com, net: RULE.base + com - RULE.social };
}
function restText(e){
  if(e.rest==="normal") return ["正常出勤", ""];
  return [`${REST[e.rest]} ${e.dates.length} 天`, e.dates.map(md).join("、")];
}
function monthRange(){
  const [y,mo]=month.split("-").map(Number), last=new Date(y,mo,0).getDate();
  return [`${month}-01`, `${month}-${String(last).padStart(2,"0")}`];
}

/* ========= 员工卡片 ========= */
function renderList(){
  const [mn,mx] = monthRange();
  $("list").innerHTML = list().map((e,i) => `
    <div class="card emp" data-id="${e.id}">
      <div class="ehead">
        <span class="no">${i+1}</span>
        <input class="nm" type="text" placeholder="员工姓名" value="${esc(e.name)}">
        <button class="del">删除</button>
      </div>
      <label class="f">当月业绩（元）</label>
      <input class="perf" type="number" inputmode="decimal" placeholder="例如 80000" value="${esc(e.perf)}">
      <label class="f">本月休息情况</label>
      <div class="opts">${Object.keys(REST).map(k=>`<button data-rest="${k}" class="${e.rest===k?"on":""}">${REST[k]}</button>`).join("")}</div>
      <div class="rdwrap" style="display:${e.rest==="normal"?"none":""}">
        <div class="addrow"><input class="rd" type="date" min="${mn}" max="${mx}"></div>
        <div class="chips"></div><div class="count"></div>
      </div>
      <div class="epay"></div>
      <button class="btn sm gen">生成 ${esc(e.name)||"TA"} 的工资单图片</button>
      <div class="err"></div>
      <div class="out"><img alt="工资单"><p>长按图片保存或直接转发给员工</p></div>
    </div>`).join("");
  list().forEach(e => refreshCard(e));
  renderSum();
}
const cardOf = e => $("list").querySelector(`[data-id="${e.id}"]`);
function refreshCard(e){
  const c = cardOf(e); if(!c) return;
  const r = calcPay(e), [rt, rd] = restText(e);
  c.querySelector(".chips").innerHTML = e.dates.map(d=>`<span class="chip">${md(d)}<button data-del="${d}" aria-label="删除">×</button></span>`).join("");
  c.querySelector(".count").textContent = e.dates.length ? `${REST[e.rest]} ${e.dates.length} 天` : "选好日期会自动加进来，可以加多天";
  c.querySelector(".epay").innerHTML = r ? `
    <div class="lab">实发工资</div>
    <div class="big serif">${money(r.net)}</div>
    <div class="line">底薪 ${money(RULE.base)} ＋ 提成 ${money(r.com)} － 社保 ${money(RULE.social)} · ${rt}</div>
    <span class="badge">本月档位：${r.t.label} · ${pct(r.t.rate)}</span>`
    : `<div class="empty">填上业绩，这里直接算出实发工资</div>`;
  c.querySelector(".gen").textContent = `生成 ${e.name.trim()||"TA"} 的工资单图片`;
  c.querySelector(".out").style.display = "none";
  c.querySelector(".err").textContent = "";
}

/* ========= 本月合计 ========= */
function renderSum(){
  const all = list(), done = all.map(e=>[e,calcPay(e)]).filter(([,r])=>r);
  const total = done.reduce((n,[,r])=>n+r.net,0), perf = done.reduce((n,[,r])=>n+r.p,0);
  const miss = all.length - done.length;
  const [y,m] = month.split("-");
  $("sum").innerHTML = `
    <div class="lab">${y} 年 ${+m} 月 · 全店实发工资合计</div>
    <div class="big serif">${money(total)}</div>
    ${done.length ? `<table class="stab">
      ${done.map(([e,r])=>`<tr><td>${esc(e.name)||"未填姓名"}<small>业绩 ${money(r.p)} · ${pct(r.t.rate)}</small></td><td class="rate">${money(r.net)}</td></tr>`).join("")}
      <tr class="tot"><td>共 ${done.length} 人<small>总业绩 ${money(perf)}</small></td><td>${money(total)}</td></tr>
    </table>` : `<div class="empty">员工填上业绩后，这里自动加总</div>`}
    ${miss ? `<div class="warn">还有 ${miss} 人没填业绩，暂未算进合计</div>` : ""}`;
  $("sumOut").style.display = "none"; $("sumErr").textContent = "";
}

/* ========= 交互 ========= */
$("list").addEventListener("input", ev => {
  const c = ev.target.closest(".emp"); if(!c) return; const e = find(c.dataset.id);
  if(ev.target.classList.contains("nm"))   e.name = ev.target.value;
  if(ev.target.classList.contains("perf")) e.perf = ev.target.value;
  save(); refreshCard(e); renderSum();
});
$("list").addEventListener("change", ev => {
  if(!ev.target.classList.contains("rd")) return;
  const c = ev.target.closest(".emp"), e = find(c.dataset.id), v = ev.target.value, [mn,mx] = monthRange();
  ev.target.value = "";
  if(!v || e.dates.includes(v)) return;
  if(v<mn || v>mx){ refreshCard(e); c.querySelector(".err").textContent = "日期不在所选工资月份里"; return; }
  e.dates.push(v); e.dates.sort(); save(); refreshCard(e);
});
$("list").addEventListener("click", ev => {
  const c = ev.target.closest(".emp"); if(!c) return; const e = find(c.dataset.id);
  const b = ev.target.closest("button"); if(!b) return;
  if(b.dataset.rest){
    e.rest = b.dataset.rest; if(e.rest==="normal") e.dates = [];
    c.querySelectorAll(".opts button").forEach(x => x.classList.toggle("on", x===b));
    c.querySelector(".rdwrap").style.display = e.rest==="normal" ? "none" : "";
    save(); refreshCard(e); renderSum();
  } else if(b.dataset.del){
    e.dates = e.dates.filter(d => d!==b.dataset.del); save(); refreshCard(e);
  } else if(b.classList.contains("del")){
    if(!confirm(`删除 ${e.name.trim()||"这位员工"}？`)) return;
    db.months[month] = list().filter(x => x!==e); save(); renderList();
  } else if(b.classList.contains("gen")){
    make(e, c);
  }
});
$("addEmp").onclick = () => {
  list().push(newEmp("")); save(); renderList();
  const cards = $("list").querySelectorAll(".emp"), last = cards[cards.length-1];
  last.scrollIntoView({behavior:"smooth", block:"center"}); last.querySelector(".nm").focus({preventScroll:true});
};
$("mon").addEventListener("input", () => { if(!$("mon").value) return; month = $("mon").value; save(); renderList(); });
$("sumBtn").onclick = makeSum;

/* ========= 画图公用 ========= */
const INK="#141210", INK2="#5F564D", INK3="#9C938A", AC="#A9873F", BD="#D8CDBB";
const F=(w,s)=>`${w} ${s}px -apple-system,"PingFang SC","Hiragino Sans GB",sans-serif`;
const SONG=(w,s)=>`${w} ${s}px "Songti SC","STSong",serif`;
const SERIF=s=>`400 ${s}px Didot,"Bodoni 72",Georgia,serif`;
function sheet(W,H,title){
  const c=document.createElement("canvas"); c.width=W; c.height=H;
  const x=c.getContext("2d"), [ym,mm]=month.split("-");
  x.fillStyle="#FAF8F5"; x.fillRect(0,0,W,H);
  x.strokeStyle="#C9B183"; x.lineWidth=2.5; x.strokeRect(36,36,W-72,H-72);
  x.strokeStyle=BD; x.lineWidth=1; x.strokeRect(46,46,W-92,H-92);
  x.textAlign="center"; x.fillStyle=AC; x.font=SONG(600,40); x.fillText("身 外 织 物",W/2,160);
  x.fillStyle=INK; x.font=SONG(600,60); x.fillText(title,W/2,250);
  x.fillStyle=INK3; x.font=F(400,28); x.fillText(`${ym} 年 ${+mm} 月`,W/2,298);
  x.strokeStyle=BD; x.beginPath(); x.moveTo(96,330); x.lineTo(W-96,330); x.stroke();
  x.textAlign="left";
  return [c,x];
}
const hline = (x,y,a,b) => { x.strokeStyle=BD; x.beginPath(); x.moveTo(a,y); x.lineTo(b,y); x.stroke(); };
function show(out, c){ const img=out.querySelector("img"); img.src=c.toDataURL("image/png"); out.style.display="block"; out.scrollIntoView({behavior:"smooth", block:"start"}); }

/* ========= 单人工资单图片 ========= */
function make(e, card){
  const err = card.querySelector(".err"), r = calcPay(e), name = e.name.trim();
  err.textContent = "";
  if(!name) return err.textContent = "请先填写员工姓名";
  if(!r) return err.textContent = "请填写当月业绩";
  if(e.rest!=="normal" && !e.dates.length) return err.textContent = `选了「${REST[e.rest]}」，请添加具体日期`;

  const [rt, rd] = restText(e);
  const lines = [
    ["姓名", name, ""], ["岗位", RULE.name, ""], ["当月业绩", money(r.p), ""],
    ["月底薪", money(RULE.base), ""], ["提成", `＋${money(r.com)}（${pct(r.t.rate)}）`, ""],
    ["社保", "－" + money(RULE.social), ""], ["出勤", rt, rd],
  ];
  const W=1080, PAD=96, linesH = lines.reduce((n,l)=>n+(l[2]?118:76),0);
  const [c,x] = sheet(W, 400 + linesH + 40 + TIERS.length*64 + 40 + 190 + 260, "工 资 单");

  let y=400;
  for(const [k,v,sub] of lines){
    x.fillStyle=INK3; x.font=F(400,32); x.fillText(k,PAD,y);
    x.fillStyle=INK;  x.font=F(600,34); x.textAlign="right"; x.fillText(v,W-PAD,y);
    if(sub){ x.fillStyle=INK2; x.font=F(400,28); x.fillText(sub,W-PAD,y+44); }
    x.textAlign="left"; y += sub?118:76;
  }
  y+=10; x.fillStyle=INK3; x.font=F(400,30); x.fillText("提成档位（当月个人业绩）",PAD,y); y+=30;
  for(const tr of TIERS){
    y+=64; const hit = tr===r.t;
    x.fillStyle= hit ? "#F3E6CB" : "#F2EEE7"; x.fillRect(PAD,y-44,W-PAD*2,58);
    x.fillStyle= hit ? INK : INK2; x.font=F(hit?600:400,32); x.fillText(tr.label + (hit?"　← 本月":""),PAD+24,y);
    x.fillStyle=AC; x.font=F(700,34); x.textAlign="right"; x.fillText(pct(tr.rate),W-PAD-24,y); x.textAlign="left";
  }
  y+=60; hline(x,y,PAD,W-PAD);
  y+=90; x.fillStyle=INK2; x.font=F(400,34); x.fillText("实发工资",PAD,y);
  x.fillStyle=AC; x.font=SERIF(72); x.textAlign="right"; x.fillText(money(r.net),W-PAD,y+8); x.textAlign="left";
  y+=60; hline(x,y,PAD,W-PAD);

  /* 签名先留空，纸上或以后再签 */
  y+=100; x.fillStyle=INK3; x.font=F(400,30); x.strokeStyle=INK3;
  x.fillText("员工签名",PAD,y); x.beginPath(); x.moveTo(PAD+140,y+6); x.lineTo(PAD+470,y+6); x.stroke();
  x.fillText("日期",PAD+530,y);   x.beginPath(); x.moveTo(PAD+610,y+6); x.lineTo(W-PAD,y+6); x.stroke();

  show(card.querySelector(".out"), c);
}

/* ========= 全店汇总图片 ========= */
function makeSum(){
  const done = list().map(e=>[e,calcPay(e)]).filter(([,r])=>r);
  $("sumErr").textContent = "";
  if(!done.length) return $("sumErr").textContent = "还没有员工填业绩";
  const total = done.reduce((n,[,r])=>n+r.net,0), perf = done.reduce((n,[,r])=>n+r.p,0);
  const miss = list().length - done.length;
  const W=1080, PAD=96;
  const [c,x] = sheet(W, 400 + 70 + done.length*96 + 60 + 200 + (miss?60:0) + 120, "工 资 汇 总");

  const cx = [PAD, 470, 700, W-PAD];   // 姓名 / 业绩 / 提成 / 实发
  let y=400;
  x.fillStyle=INK3; x.font=F(400,28);
  x.fillText("姓名",cx[0],y);
  x.textAlign="right"; x.fillText("当月业绩",cx[1]+120,y); x.fillText("提成",cx[2]+90,y); x.fillText("实发工资",cx[3],y); x.textAlign="left";
  y+=30; hline(x,y,PAD,W-PAD);
  for(const [e,r] of done){
    y+=66;
    x.fillStyle=INK; x.font=F(600,34); x.fillText(e.name.trim()||"未填姓名",cx[0],y);
    x.textAlign="right";
    x.fillStyle=INK2; x.font=F(400,30); x.fillText(money(r.p),cx[1]+120,y); x.fillText(pct(r.t.rate),cx[2]+90,y);
    x.fillStyle=INK; x.font=F(600,34); x.fillText(money(r.net),cx[3],y);
    x.textAlign="left"; y+=30; hline(x,y,PAD,W-PAD);
  }
  y+=60; x.fillStyle=INK2; x.font=F(400,30); x.fillText(`共 ${done.length} 人 · 总业绩 ${money(perf)}`,PAD,y);
  y+=110; x.fillStyle=INK2; x.font=F(400,34); x.fillText("实发工资合计",PAD,y);
  x.fillStyle=AC; x.font=SERIF(76); x.textAlign="right"; x.fillText(money(total),W-PAD,y+8); x.textAlign="left";
  if(miss){ y+=70; x.fillStyle="#B0644F"; x.font=F(400,28); x.fillText(`另有 ${miss} 人未填业绩，未计入合计`,PAD,y); }

  show($("sumOut"), c);
}

(function(){
  const d=new Date(), p=n=>String(n).padStart(2,"0");
  month = `${d.getFullYear()}-${p(d.getMonth()+1)}`;
  $("mon").value = month;
  renderList();
})();
